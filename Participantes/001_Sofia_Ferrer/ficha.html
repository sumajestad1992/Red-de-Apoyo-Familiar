
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Red de Apoyo Familiar - Sofía Ferrer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #172033;
            margin: 0;
            padding: 20px 16px;
        }

        .tarjeta {
            max-width: 420px;
            margin: 0 auto;
            padding: 26px 24px;
            background: white;
            border: 1px solid #dce5ed;
            border-top: 8px solid #176b9a;
            border-radius: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .encabezado {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icono {
            font-size: 29px;
            color: #176b9a;
        }

        .titulo {
            color: #176b9a;
            font-size: 19px;
            font-weight: bold;
            margin: 0;
        }

        .subtitulo {
            font-size: 13px;
            color: #666;
            margin: 6px 0 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #e5e9ed;
            margin: 24px 0;
        }

        h1 {
            font-size: 27px;
            margin: 0 0 10px;
        }

        .identificador {
            color: #666;
            font-size: 14px;
        }

        .ubicacion {
            font-size: 16px;
            margin: 22px 0;
        }

        .contacto {
            background: #edf6fc;
            border-radius: 15px;
            padding: 18px;
            margin-top: 26px;
        }

        h2 {
            color: #176b9a;
            font-size: 18px;
            margin: 0 0 16px;
        }

        .familiar {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .telefono {
            display: inline-block;
            background: #dff5e8;
            color: #126b3c;
            font-size: 17px;
            font-weight: bold;
            padding: 10px 13px;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .apoyo {
            margin-top: 30px;
        }

        .indicacion {
            border: 1px solid #cbdce9;
            border-radius: 12px;
            padding: 14px;
            line-height: 1.6;
            font-size: 16px;
        }

        .pie {
            color: #777;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="tarjeta">

        <header class="encabezado">
            <span class="icono">✚</span>
            <div>
                <p class="titulo">RED DE APOYO FAMILIAR</p>
                <p class="subtitulo">
                    Identificación y contacto de emergencia
                </p>
            </div>
        </header>

        <hr>

        <h1>Sofía Ferrer</h1>
        <p class="identificador">
            Identificador: 001
        </p>

        <p class="ubicacion">📍 Puente Alto</p>

        <section class="contacto">
            <h2>☎ Contacto de emergencia</h2>
            <p class="familiar">
                Laura Méndez — Madre
            </p>
            <span class="telefono">+56 9 0000 0099</span>
        </section>

        <section class="apoyo">
            <h2>▣ Indicaciones de apoyo</h2>
            <div class="indicacion">Hablar con calma y dar tiempo para responder</div>
        </section>

        <hr>

        <footer class="pie">
            Prototipo académico - Información ficticia
        </footer>

    </main>
</body>
</html>
